bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom      # no map frame exists on the real car (no SLAM/GPS anchor yet)
    robot_base_frame: base_link
    transform_tolerance: 0.3
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.05
    failure_tolerance: 0.5
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 45.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 1.57

    # 1-5mph cruising band (user-specified real-car speed cap), same reasoning
    # as the CARLA fix: fixed (not velocity-scaled) lookahead, shortened from
    # the sim's car-sized values to match this vehicle's ~0.5m radius and
    # tighter turning circle.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.894          # 2 mph (user-set for person-avoidance test)
      min_approach_linear_velocity: 0.447 # 1 mph
      lookahead_dist: 2.0
      min_lookahead_dist: 1.5
      max_lookahead_dist: 3.0
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 1.5
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      regulated_linear_scaling_min_radius: 3.0
      regulated_linear_scaling_min_speed: 0.447
      use_rotate_to_heading: false
      allow_reversing: false
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 3.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.1
      robot_radius: 0.5
      transform_tolerance: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]

      # NOTE: there is deliberately NO static_layer. An earlier design fed the
      # perception grid to a StaticLayer via costmap_odom_republisher.py, but
      # StaticLayer/Costmap2D is axis-aligned and can't represent a rotating
      # robot-relative grid. The active design instead raycasts the perception
      # costmap to visible-surface points (costmap_to_cloud.py) and feeds them
      # to the ObstacleLayer below. costmap_odom_republisher.py is retained only
      # as a reference alternative and is NOT used on this path.
      #
      # ROAD-KEEPING DEPENDENCY: off-road cells only reach Nav2 if perception
      # marks them at/above costmap_to_cloud's OBST_THRESH (97). That matches
      # perception_dinosaur.yaml's offroad_cost: 97. If you lower offroad_cost
      # below 97 (the perception_costmap.yaml default is 65), off-road stops
      # entering the cloud and road-keeping silently disappears -- keep the two
      # values in sync.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # source is the camera-costmap-derived point cloud, NOT raw lidar
        # (perception runs use_lidar:false today -- see perception_dinosaur.yaml)
        observation_sources: costmap_cloud
        costmap_cloud:
          topic: /perception/costmap_cloud
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.1
          max_obstacle_height: 2.5
          obstacle_max_range: 20.0
          raytrace_max_range: 25.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # inflation_radius must be >= footprint inscribed radius (0.5m here)
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom      # no map frame available -- odom-relative planning only
      robot_base_frame: base_link
      rolling_window: true    # mapless: no prior global map, matches local
      width: 60
      height: 60
      resolution: 0.15
      robot_radius: 0.5
      transform_tolerance: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]

      # (see local_costmap note above: no static_layer by design; the
      # ObstacleLayer's source is the perception-derived cloud, not raw lidar)
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: costmap_cloud
        costmap_cloud:
          topic: /perception/costmap_cloud
          data_type: "PointCloud2"
          marking: true
          clearing: true
          max_obstacle_height: 2.5
          obstacle_max_range: 30.0
          raytrace_max_range: 35.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.0
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator"]
    bond_timeout: 4.0
