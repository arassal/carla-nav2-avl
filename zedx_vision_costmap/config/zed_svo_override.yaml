/**:
  ros__parameters:
    svo:
      use_svo_timestamps: true
      svo_loop: false
      # Quality mode processes every frame rather than dropping frames to keep
      # wall-clock pace. Playback may be slower than the recording.
      svo_realtime: false
    general:
      pub_resolution: CUSTOM
      pub_downscale_factor: 2.0
      pub_frame_rate: 15.0
    depth:
      depth_mode: NEURAL
      depth_stabilization: 30
    pos_tracking:
      pos_tracking_enabled: false
      publish_tf: false
      publish_map_tf: false
