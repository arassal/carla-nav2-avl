# Nav2 costmap configuration that consumes this package's perception output.
#
# Two perception inputs are stacked as layers:
#   static_layer    <- /perception/costmap          (road vs off-road + cam obstacles)
#   obstacle_layer  <- /perception/obstacle_points   (lidar, with raytrace clearing)
#
# /perception/obstacle_points carries the FULL lidar sweep in base_link,
# ground returns included, despite the name: those returns are the rays that
# let ObstacleLayer raytrace-clear the road. min_obstacle_height below (NOT
# the publisher) is what keeps the ground from being marked, so it must
# match perception_costmap.yaml's lidar_z_min.
#   inflation_layer <- (built-in)                    (grow lethal cells by robot radius)
#
# Drop this into your Nav2 bringup (or load it onto the costmap nodes
# directly). Frames assume the standard map -> odom -> base_link TF tree.
# NOTE: this package's own occupancy.build_cost_array already applies
# per-class obstacle inflation (see config/perception_costmap.yaml) --
# inflation_layer below is a SECOND, geometric inflation by the robot's
# physical radius, not a duplicate of the same thing.

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.1
      robot_radius: 0.5
      plugins: ["obstacle_layer", "static_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # TWO sources on ONE topic, and it has to be two. Nav2 applies
        # min/max_obstacle_height in ObservationBuffer, which feeds marking
        # AND clearing from the same filtered cloud -- so a single source
        # with min_obstacle_height at the obstacle threshold throws away the
        # ground returns before raytracing, and those returns are the only
        # rays that pass over open road. Measured: with one source, a
        # removed pedestrian's cells stayed marked (5 -> 6) for 6+ seconds.
        observation_sources: lidar_marking lidar_clearing

        lidar_marking:
          topic: /perception/obstacle_points
          data_type: "PointCloud2"
          marking: true
          clearing: false
          # keep in sync with perception_costmap.yaml's lidar_z_min
          min_obstacle_height: 0.15
          max_obstacle_height: 2.5
          obstacle_max_range: 20.0

        lidar_clearing:
          topic: /perception/obstacle_points
          data_type: "PointCloud2"
          marking: false
          clearing: true
          # deliberately BELOW the ground so road returns survive the buffer
          # and can raytrace. Nothing is marked from this source.
          min_obstacle_height: -1.0
          max_obstacle_height: 2.5
          raytrace_max_range: 25.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /perception/costmap
        subscribe_to_updates: false
        map_subscribe_transient_local: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true        # mapless road-following: no prior global map
      width: 50
      height: 50
      resolution: 0.1
      robot_radius: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # split marking/clearing for the same reason as local_costmap above
        observation_sources: lidar_marking lidar_clearing

        lidar_marking:
          topic: /perception/obstacle_points
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: 0.15    # keep in sync with lidar_z_min
          max_obstacle_height: 2.5
          obstacle_max_range: 30.0

        lidar_clearing:
          topic: /perception/obstacle_points
          data_type: "PointCloud2"
          marking: false
          clearing: true
          min_obstacle_height: -1.0
          max_obstacle_height: 2.5
          raytrace_max_range: 35.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8
        cost_scaling_factor: 3.0
