# Experimental Nav2 consumer for the already-fused rolling OccupancyGrid.
# Validate against the installed Nav2 Humble version before vehicle use.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: false
      track_unknown_space: false
      always_send_full_costmap: true
      footprint: "[[2.5, 1.1], [2.5, -1.1], [-2.5, -1.1], [-2.5, 1.1]]"
      plugins: [seven_layer_input]
      seven_layer_input:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /seven_layer_costmap/costmap
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        transform_tolerance: 0.5
