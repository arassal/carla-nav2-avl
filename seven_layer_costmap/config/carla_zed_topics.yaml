# CARLA native ROS 2 image topics vary with sensor ros_name. Remap these inputs
# at launch if the CARLA bridge uses different names. The fusion API does not change.
carla_to_zed:
  front_rgb: /zed_front/zed_front_node/left/color/rect/image
  left_rgb: /zed_left/zed_left_node/left/color/rect/image
  right_rgb: /zed_right/zed_right_node/left/color/rect/image
  front_depth: /zed_front/zed_front_node/depth/depth_registered
  left_depth: /zed_left/zed_left_node/depth/depth_registered
  right_depth: /zed_right/zed_right_node/depth/depth_registered
future_svo:
  wrapper_package: zed_wrapper
  mode: svo
  synchronization: downstream_timestamp_skew_rejection
