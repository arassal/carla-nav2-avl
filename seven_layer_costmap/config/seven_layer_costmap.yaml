seven_layer_costmap:
  ros__parameters:
    use_sim_time: true
    publish_frequency: 10.0
    output_topic: /seven_layer_costmap/costmap
    require_all_layers: true
    stale_timeout_s: 1.0
    weights:
      lanelet: 1.0
      static_obstacle: 1.0
      spatio_temporal_voxel: 1.0
      prediction: 1.0
      inflation: 1.0
      traffic_regulation: 1.0
      road_condition: 1.0

road_condition_layer:
  ros__parameters:
    use_sim_time: true
    camera_topics:
      - /zed_front/zed_front_node/left/color/rect/image
      - /zed_left/zed_left_node/left/color/rect/image
      - /zed_right/zed_right_node/left/color/rect/image
    frame_id: base_link
    width_m: 60.0
    height_m: 60.0
    resolution: 0.20
    publish_frequency: 5.0

three_zed_perception:
  ros__parameters:
    use_sim_time: false
    camera_names: [zed_front, zed_left, zed_right]
    max_camera_skew_s: 0.050
    max_rgb_depth_skew_s: 0.035
    stale_camera_s: 0.5
    processing_frequency: 10.0
    depth_stride: 4
    min_depth_m: 0.5
    max_depth_m: 25.0
    width_m: 60.0
    height_m: 60.0
    resolution: 0.20
    frame_id: base_link
    inflation_radius_m: 2.5
    voxel_persistence_s: 2.0
    require_odometry: true
    ego_min_x: -2.5
    ego_max_x: 0.8
    ego_half_width: 1.2
    mounts:
      front:
        translation: [0.679450, 0.0, -0.107950]
        yaw: 0.0
      left:
        translation: [0.098425, -0.285750, 0.057150]
        yaw: 1.570796327
      right:
        translation: [0.098425, 0.285750, 0.057150]
        yaw: -1.570796327

synthetic_seven_layer_sources:
  ros__parameters:
    use_sim_time: true
    frame_id: base_link
    width_m: 60.0
    height_m: 60.0
    resolution: 0.20
